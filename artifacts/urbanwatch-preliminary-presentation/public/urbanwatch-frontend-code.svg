  <text x="42" y="92" fill="#8fc6ba" font-family="monospace" font-size="17">01</text>
  <text x="78" y="92" fill="#f0d09b" font-family="monospace" font-size="17">import</text>
  <text x="158" y="92" fill="#f7f3ea" font-family="monospace" font-size="17">{ signInWithEmailAndPassword }</text>
  <text x="515" y="92" fill="#f0d09b" font-family="monospace" font-size="17">from</text>
  <text x="570" y="92" fill="#efb979" font-family="monospace" font-size="17">'firebase/auth';</text>
  <text x="42" y="120" fill="#8fc6ba" font-family="monospace" font-size="17">02</text>
  <text x="78" y="120" fill="#f0d09b" font-family="monospace" font-size="17">import</text>
  <text x="158" y="120" fill="#f7f3ea" font-family="monospace" font-size="17">{ firebaseAuth }</text>
  <text x="385" y="120" fill="#f0d09b" font-family="monospace" font-size="17">from</text>
  <text x="440" y="120" fill="#efb979" font-family="monospace" font-size="17">'@/lib/firebase';</text>
  <text x="42" y="148" fill="#8fc6ba" font-family="monospace" font-size="17">03</text>
  <text x="78" y="148" fill="#7eaaa5" font-family="monospace" font-size="17">// Firebase Email/Password authentication</text>
  <text x="42" y="176" fill="#8fc6ba" font-family="monospace" font-size="17">04</text>
  <text x="78" y="176" fill="#f0d09b" font-family="monospace" font-size="17">await</text>
  <text x="137" y="176" fill="#f7f3ea" font-family="monospace" font-size="17">signInWithEmailAndPassword(</text>
  <text x="137" y="204" fill="#f7f3ea" font-family="monospace" font-size="17">firebaseAuth, email.trim(), password);</text>
  <text x="42" y="232" fill="#8fc6ba" font-family="monospace" font-size="17">05</text>
  <text x="78" y="232" fill="#7eaaa5" font-family="monospace" font-size="17">// Protected report form submits authenticated evidence</text>
  <text x="42" y="260" fill="#8fc6ba" font-family="monospace" font-size="17">06</text>
  <text x="78" y="260" fill="#f0d09b" font-family="monospace" font-size="17">const</text>
  <text x="140" y="260" fill="#f7f3ea" font-family="monospace" font-size="17">imageUrl = imageFile</text>
  <text x="390" y="260" fill="#f0d09b" font-family="monospace" font-size="17">?</text>
  <text x="420" y="260" fill="#f7f3ea" font-family="monospace" font-size="17">await uploadImageToCloudinary(</text>
  <text x="420" y="288" fill="#f7f3ea" font-family="monospace" font-size="17">imageFile, await user.getIdToken())</text>
  <text x="42" y="316" fill="#8fc6ba" font-family="monospace" font-size="17">07</text>
  <text x="78" y="316" fill="#f0d09b" font-family="monospace" font-size="17">await</text>
  <text x="137" y="316" fill="#f7f3ea" font-family="monospace" font-size="17">createComplaint({ ...report, imageUrl });</text>
  <text x="42" y="344" fill="#8fc6ba" font-family="monospace" font-size="17">08</text>
  <text x="78" y="344" fill="#7eaaa5" font-family="monospace" font-size="17">// Firestore persistence follows a successful upload</text>
